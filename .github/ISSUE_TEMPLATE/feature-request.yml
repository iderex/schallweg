name: Feature request
description: Something you need this to do that it does not do.
labels: ["enhancement"]
body:
  - type: textarea
    id: cannot
    attributes:
      label: What you cannot do today
      description: The task, not the solution. What are you trying to produce.
    validations:
      required: true
  - type: textarea
    id: instead
    attributes:
      label: What you do instead
      description: >
        The spreadsheet, the other tool, the hand calculation, or nothing. This
        is the most useful field in this form: it says how much the gap costs
        and what the answer has to beat.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How you would know it was done
      description: What you would check to be satisfied.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Anything here that applies
      options:
        - label: This needs the text of the standard to implement
        - label: This needs component data this project does not have
        - label: This would send something off the machine it runs on
