# The dependency graph check.
#
# The build check answers whether the code compiles. This one answers a
# different question: whether the graph it compiled against is the graph the tree
# declares, and whether anything in that graph is known to be vulnerable.
#
# What has to be true before a dependency is added at all, and why this project
# intends to have almost none, is docs/dependency-policy.md. This file is the
# half of that a machine refuses.
#
# Four legs, and each is here because it catches something the others cannot.
#
#   Read-only resolution. `-mod=readonly` refuses a build that would have to edit
#   `go.mod` or `go.sum` to succeed. Without it a missing requirement is repaired
#   silently by the build and the repair is only visible to whoever notices the
#   file changed afterwards, which on a runner is nobody. This is also the leg
#   that refuses an edited lock file: fetching a module compares it against the
#   hash `go.sum` records and stops with a checksum mismatch, measured on the
#   branch named in issue #27.
#
#   Hash verification. `go mod verify` compares the module cache against what was
#   downloaded into it, so what it catches is a cache altered after the fact
#   rather than a lock file that was edited. On a run with no restored cache
#   there is little for it to find, and it is kept because the day the cache is
#   restored to save time is the day it has something to say. It is not the
#   checksum guard, and the measurement above is what corrected that.
#
#   Tidiness. `go mod tidy` followed by a refusal of any change catches drift in
#   both directions, which is why it is not the same check as the first leg: a
#   dependency the source uses but the module does not declare, and a dependency
#   the module declares that no source line still needs.
#
#   Vulnerability scan. `govulncheck` reads the advisory database and the call
#   graph, so it reports what this code can actually reach rather than everything
#   present in the module list. It covers the standard library too, which matters
#   more here than in most projects: with no third-party modules, the standard
#   library and the toolchain are the whole supply chain.
#
# The scan also runs weekly, because an advisory published tomorrow is about code
# that was written yesterday and nothing in this repository will have changed.
#
# The scanner reaches the advisory database over the network. That is this job
# and not this project: docs/decisions/nothing-leaves-the-host.md is about what
# the program does on an operator's machine, and a check running on a build
# machine is outside it.
name: Dependencies

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  schedule:
    # Weekly, at a time no other workflow in this repository already uses, so a
    # scheduled run is legible in the run list on its own.
    - cron: "17 5 * * 2"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    # This `name:` is the literal check-run name, set explicitly rather than left
    # to default to the job id, so renaming the job id cannot silently change the
    # name a required-check list matches. Issue #36 collects the names to require.
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      # The scanner is pinned to a version rather than taken at whatever is
      # newest, for the reason every action here is pinned to a hash: an input to
      # a build that can change under it is an input nobody reviewed.
      GOVULNCHECK_VERSION: v1.6.0
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The minimum version lives in go.mod and nowhere else.
          go-version-file: go.mod
          # No cache: this job is about what the tree resolves to from clean, and
          # a restored module cache would let it answer a different question.
          cache: false

      - name: Refuse a build that would change the module graph
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          # GOFLAGS carries -mod=readonly for every go command in this job, so a
          # build needing a requirement the tree does not declare fails here
          # instead of adding it.
          go build -o "$out/" ./...
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::The build changed go.mod or go.sum. The graph a build resolves has to be the graph the tree declares."
            exit 1
          fi
          echo "The build resolved without changing the declared graph."

      - name: Verify every module against the hashes the lock records
        run: |
          set -euo pipefail
          go mod verify
          echo "Every module in the graph hashes to what go.sum records."

      - name: Refuse a declaration that drifted from the source
        run: |
          set -euo pipefail
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go mod tidy changed the tree. Run 'go mod tidy' locally and commit the result."
            exit 1
          fi
          echo "go.mod and go.sum are exactly what the source needs."

      - name: Scan the resolved graph for known vulnerabilities
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...
          echo "No known vulnerability is reachable from this code."

      - name: Say what this job did not cover
        # A run that covered less than everything must not read like one that
        # covered everything and found nothing.
        run: |
          set -euo pipefail
          echo "This job did not check:"
          echo "  licences         no licence of any dependency is read or judged here."
          echo "                   The licence of this repository is an open"
          echo "                   maintainer decision on issue #1, so there is"
          echo "                   nothing yet to judge compatibility against."
          echo "  maintenance      nothing here notices that a dependency stopped"
          echo "                   being maintained. That is a judgement made when"
          echo "                   the dependency is added, in the pull request"
          echo "                   that adds it."
          echo "  the actions      the workflows install actions and one tool from"
          echo "                   outside this repository. They are pinned, and"
          echo "                   no leg above scans them for vulnerabilities."
          echo
          echo "The advisory database this scan read is a moving target, so a green"
          echo "run says what was known today and nothing about tomorrow. That is"
          echo "what the weekly run is for."
