# The build check.
#
# The first thing a gate has to be able to say is that the code builds. This job
# says it from a clean checkout, with no cached build state, on every pull
# request and on every push to the default branch.
#
# Warnings as errors needs a word, because Go has no warning level to turn up.
# The compiler refuses the things another language would warn about: an unused
# import and an unused local variable are hard errors, not diagnostics. So the
# strictest available setting is the default one, and there is no flag to add.
# What a warning level would otherwise catch is covered by `go vet` in the
# format-and-vet job rather than repeated here.
#
# The build writes outside the working tree and the tree is then checked for any
# file the build left behind, because `go build ./...` run from the root drops
# the executable into the current directory, and an artefact sitting in a working
# tree is how one gets committed.
#
# The job also writes the bill of materials for both things this repository
# ships, and uploads each beside what it describes. It is produced here rather
# than at release time so that a change to what is inside the program is visible
# in the review of the change that caused it, and it is read out of the binary
# this job built rather than out of the source, because those can differ and the
# question a user asks is about the artefact they were given. Why the format is
# what it is, and what the document does not say, is in
# docs/decisions/bill-of-materials.md.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # This `name:` is the literal check-run name, set explicitly rather than left
    # to default to the job id, so renaming the job id cannot silently change the
    # name a required-check list matches. Issue #36 collects the names to require.
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Refuse a build that would change the module graph, and use exactly the
      # toolchain set up below rather than fetching another one mid-build.
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The minimum version lives in go.mod and nowhere else.
          go-version-file: go.mod
          # No build cache: this check answers whether the code builds from a
          # clean checkout, and a restored cache would let it answer a different
          # question.
          cache: false

      - name: Build every package
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/build"
          mkdir -p "$out"
          go build -o "$out/" ./...
          echo "Built into $out:"
          ls -1 "$out"

      - name: Refuse anything the build left in the tree
        run: |
          set -euo pipefail
          left="$(git status --porcelain)"
          if [ -n "$left" ]; then
            echo "::error::The build left files in the working tree. Build output belongs outside it."
            echo "$left"
            exit 1
          fi
          echo "The working tree is unchanged by the build."

      # The bill of materials is produced here rather than beside the build,
      # because a document reconstructed afterwards describes what somebody
      # believed was linked. This one is read out of the binary this job just
      # made.
      #
      # The timestamp is the commit's own and the namespace carries the commit
      # sha, so the same commit produces the same document twice and a document
      # that differs means the artefact differs.
      - name: Bill of materials for the program
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/build"
          created="$(git log -1 --format=%cI)"
          go run ./cmd/sbom \
            -subject program \
            -binary "$out/schallweg" \
            -created "$created" \
            -namespace "https://github.com/${GITHUB_REPOSITORY}/spdx/program/${GITHUB_SHA}" \
            -out "$out/schallweg.spdx.json"
          echo "Wrote $out/schallweg.spdx.json"

      # Separately from the program, because the two are released separately and
      # a user may take only one. What the document travels with today is
      # nothing: the database artefact itself is not built by this route yet, so
      # the document is uploaded alone rather than pretending to accompany
      # something.
      - name: Bill of materials for the database
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/build"
          created="$(git log -1 --format=%cI)"
          go run ./cmd/sbom \
            -subject database \
            -root data \
            -created "$created" \
            -namespace "https://github.com/${GITHUB_REPOSITORY}/spdx/database/${GITHUB_SHA}" \
            -out "$RUNNER_TEMP/database.spdx.json"
          echo "Wrote $RUNNER_TEMP/database.spdx.json"

      # Two things are refused here, and the second one is the point.
      #
      # The declared format version, because a document that quietly changed
      # format is one that every reader downstream reads wrongly.
      #
      # And a module the binary records that the document does not name. That
      # compares the command's reader against the toolchain's own printer, which
      # is a different route to the same fact. Stated exactly: with an empty
      # module graph this leg compares an empty list and passes without having
      # refused anything, so a green run here today is weaker evidence than the
      # same run on a tree with a dependency in it.
      - name: Refuse a document that does not describe what was built
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/build"
          doc="$out/schallweg.spdx.json"

          version="$(jq -r '.spdxVersion' "$doc")"
          if [ "$version" != "SPDX-2.3" ]; then
            echo "::error::The program document declares $version, and this repository writes SPDX-2.3."
            exit 1
          fi

          missing=0
          while read -r module; do
            [ -n "$module" ] || continue
            if ! jq -e --arg m "$module" '.packages[] | select(.name == $m)' "$doc" > /dev/null; then
              echo "::error::The binary records module $module and the document does not name it."
              missing=1
            fi
          done <<< "$(go version -m "$out/schallweg" | awk '$1 == "dep" { print $2 }')"
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "The document declares $version and names every module the binary records:"
          jq -r '.packages[] | "  \(.name) \(.versionInfo // "")"' "$doc"

      - name: Upload the program and its bill of materials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: program
          path: ${{ runner.temp }}/build
          if-no-files-found: error

      - name: Upload the database bill of materials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-bill-of-materials
          path: ${{ runner.temp }}/database.spdx.json
          if-no-files-found: error
